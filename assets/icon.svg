<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="鲸鱼娘·小毛 图标：红军红底、暖白圆盘、蓝色鲸鱼尾、红色五角星">
  <title>鲸鱼娘·小毛</title>
  <!-- 底板：红军红圆角方块 -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="#C1342B"/>
  <!-- 内描边：在深色界面 / 深色插件市场卡片上保住边界 -->
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="#FFF6E9" stroke-width="6" stroke-opacity="0.26"/>
  <!-- 暖白圆盘：给蓝色鲸尾与红星提供对比度 -->
  <circle cx="256" cy="262" r="150" fill="#FFF6E9"/>
  <!-- 红五星：10 点纯几何星形，中心 (256,158)，外径 36，内径 13.75 -->
  <polygon fill="#C1342B" points="256,122 264.08,146.88 290.24,146.88 269.08,162.25 277.16,187.12 256,171.75 234.84,187.12 242.92,162.25 221.76,146.88 247.92,146.88"/>
  <!-- 鲸鱼尾：右瓣尾鳍（圆头尾尖） -->
  <path fill="#2E6FB8" d="M256 302 C288 306 326 298 356 280 C384 262 404 234 400 210 A24 24 0 0 0 358 204 C338 232 312 266 290 292 C278 302 266 300 256 302 Z"/>
  <!-- 鲸鱼尾：左瓣尾鳍（与右瓣镜像对称） -->
  <path fill="#2E6FB8" d="M256 302 C224 306 186 298 156 280 C128 262 108 234 112 210 A24 24 0 0 1 154 204 C174 232 200 266 222 292 C234 302 246 300 256 302 Z"/>
  <!-- 尾柄：略深的蓝，把两瓣尾鳍收成一个「尾」 -->
  <path fill="#1E4E8A" d="M240 302 C238 332 244 356 256 382 C268 356 274 332 272 302 Z"/>
</svg>
