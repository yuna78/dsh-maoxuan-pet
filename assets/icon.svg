<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="鲸鱼娘·小毛 图标：米白底上的一本红皮书《毛泽东选集》，封面烫金五角星与书名条">
  <title>鲸鱼娘·小毛</title>
  <!-- 底板：米白圆角方块（深色市场卡片上有边界，浅色界面下不刺眼） -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="#FFF6E9"/>
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="#C1342B" stroke-width="6" stroke-opacity="0.16"/>

  <!-- 投影：把书从米白底上「抬」起来 -->
  <g filter="url(#softShadow)" opacity="0.22">
    <rect x="132" y="112" width="286" height="308" rx="28" fill="#7A1410"/>
  </g>

  <g transform="translate(252,256) scale(1.08) translate(-258,-256)">
    <!-- 书页块：右侧露出的米黄页缘 + 两道浅红页线 -->
    <g>
      <path d="M330 118 h78 a14 14 0 0 1 14 14 v248 a14 14 0 0 1 -14 14 h-78 z" fill="#EFDFC4"/>
      <path d="M356 138 v236 M382 138 v236" stroke="#D9C4A2" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- 书壳：深红封面 + 更深一档的书脊 -->
    <g>
      <rect x="120" y="104" width="232" height="304" rx="26" fill="#B3271E"/>
      <rect x="120" y="104" width="46" height="304" rx="22" fill="#8F1E17"/>
      <!-- 书脊烫金线 -->
      <path d="M143 148 v216" stroke="#E8C36A" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- 封面烫金细框 -->
    <rect x="192" y="126" width="142" height="260" rx="14" fill="none" stroke="#E8C36A" stroke-width="5" stroke-opacity="0.55"/>

    <!-- 五角星（10 点纯几何）：中心 (263,196)，外径 46，内径 17.6 -->
    <polygon fill="#E8C36A" points="263,150 273.32,181.76 306.72,181.76 279.7,201.74 289.02,234.5 263,214.25 236.98,234.5 246.3,201.74 219.28,181.76 252.68,181.76"/>

    <!-- 书名条：两道烫金横杠，替代小字（36px 下也能读成「书名」） -->
    <g fill="#E8C36A">
      <rect x="215" y="272" width="96" height="16" rx="8"/>
      <rect x="232" y="304" width="62" height="13" rx="6.5" opacity="0.78"/>
    </g>
  </g>

  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
</svg>
